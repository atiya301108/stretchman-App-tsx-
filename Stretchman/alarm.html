<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Stretchman - Alarm</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/alarm.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>

<main class="alarm-page">


    <!-- HEADER -->

    <header class="alarm-header">

        <div>

            <h1>
                Alarm
            </h1>

            <p>
                ตั้งเวลาเตือนให้คุณยืดกล้ามเนื้อ
            </p>

        </div>

        <div class="alarm-header-icon">

            <i class="fa-solid fa-bell"></i>

        </div>

    </header>



    <!-- ADD ALARM -->

    <section class="add-alarm-card">

        <div class="card-title">

            <div class="title-icon">

                <i class="fa-solid fa-plus"></i>

            </div>

            <div>

                <h2>
                    เพิ่มเวลายืด
                </h2>

                <p>
                    ตั้งเวลาที่ต้องการให้ Stretchman เตือน
                </p>

            </div>

        </div>


        <div class="alarm-form">

            <div class="form-group">

                <label for="alarmTime">
                    เวลา
                </label>

                <input
                    type="time"
                    id="alarmTime">

            </div>


            <div class="form-group">

                <label for="alarmLabel">
                    ชื่อการแจ้งเตือน
                </label>

                <input
                    type="text"
                    id="alarmLabel"
                    placeholder="เช่น ยืดตอนเช้า">

            </div>


            <div class="form-group">

                <label>
                    วัน
                </label>

                <div class="day-selector">

                    <button class="day-btn" data-day="1">
                        จ
                    </button>

                    <button class="day-btn" data-day="2">
                        อ
                    </button>

                    <button class="day-btn" data-day="3">
                        พ
                    </button>

                    <button class="day-btn" data-day="4">
                        พฤ
                    </button>

                    <button class="day-btn" data-day="5">
                        ศ
                    </button>

                    <button class="day-btn" data-day="6">
                        ส
                    </button>

                    <button class="day-btn" data-day="0">
                        อา
                    </button>

                </div>

            </div>


            <button
                class="add-button"
                id="addAlarmBtn">

                <i class="fa-solid fa-plus"></i>

                เพิ่มการแจ้งเตือน

            </button>

        </div>

    </section>



    <!-- ALARM LIST -->

    <section class="alarm-list-section">

        <div class="section-title">

            <div>

                <h2>
                    การแจ้งเตือนของคุณ
                </h2>

                <p>
                    ตั้งเวลาการยืดที่ต้องการ
                </p>

            </div>

            <span id="alarmCount">
                0 รายการ
            </span>

        </div>


        <div
            class="alarm-list"
            id="alarmList">

            <!-- JavaScript สร้าง Alarm ตรงนี้ -->

        </div>


        <div
            class="empty-alarm"
            id="emptyAlarm">

            <i class="fa-regular fa-bell-slash"></i>

            <strong>
                ยังไม่มีการแจ้งเตือน
            </strong>

            <span>
                เพิ่มเวลายืดด้านบนเพื่อเริ่มต้น
            </span>

        </div>

    </section>



    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <a
            href="home.html"
            class="nav-item">

            <i class="fa-solid fa-house"></i>

            <span>
                Home
            </span>

        </a>


        <a
            href="quest.html"
            class="nav-item">

            <i class="fa-solid fa-book-open"></i>

            <span>
                Quest
            </span>

        </a>


        <a
            href="alarm.html"
            class="nav-item active">

            <i class="fa-solid fa-bell"></i>

            <span>
                Alarm
            </span>

        </a>


        <a
            href="shop.html"
            class="nav-item">

            <i class="fa-solid fa-cart-shopping"></i>

            <span>
                Shop
            </span>

        </a>


        <a
            href="settings.html"
            class="nav-item">

            <i class="fa-solid fa-gear"></i>

            <span>
                Settings
            </span>

        </a>

    </nav>


</main>


<script src="js/app.js"></script>
<script src="js/alarm.js"></script>
<script src="js/theme.js"></script>

</body>

</html>
