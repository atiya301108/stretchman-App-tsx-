<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stretchman - Shop</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/shop.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<main class="shop-page">

    <!-- HEADER -->
    <header class="shop-header">

        <div>
            <h1>Shop</h1>
            <p>ร้านค้าของ Stretchman</p>
        </div>

        <!-- COINS -->
        <div class="coin-display">

            <i class="fa-solid fa-coins"></i>

            <span id="coinAmount">
                0
            </span>

        </div>

    </header>


    <!-- SHOP CONTENT -->
    <section class="shop-content">

        <div class="empty-shop">

            <div class="shop-icon">
                <i class="fa-solid fa-store"></i>
            </div>

            <h2>ร้านค้ากำลังเตรียมตัว</h2>

            <p>
                ตอนนี้ยังไม่มีไอเทมในร้านค้า
            </p>

            <span>
                ไว้ระบบเกมพร้อมแล้ว
                เราจะเพิ่มไอเทมให้คุณ
            </span>

        </div>

    </section>


    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">

        <a href="home.html" class="nav-item">

            <i class="fa-solid fa-house"></i>

            <span>Home</span>

        </a>


        <a href="quest.html" class="nav-item">

            <i class="fa-solid fa-book-open"></i>

            <span>Quest</span>

        </a>


        <a href="alarm.html" class="nav-item">

            <i class="fa-solid fa-bell"></i>

            <span>Alarm</span>

        </a>


        <a href="shop.html" class="nav-item active">

            <i class="fa-solid fa-cart-shopping"></i>

            <span>Shop</span>

        </a>


        <a href="settings.html" class="nav-item">

            <i class="fa-solid fa-gear"></i>

            <span>Settings</span>

        </a>

    </nav>

</main>


<script src="js/shop.js"></script>
<script src="js/theme.js"></script>
</body>

</html>
