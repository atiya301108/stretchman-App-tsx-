<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stretchman - Home</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="home-page">

        <div class="top-stats">
            <div class="stat-badge streak">
                <i class="fa-solid fa-fire"></i>
                <span>67</span>
            </div>
            <div class="stat-badge coin">
                <img src="images/coin.png" alt="Coin">
                <span>6.7M</span>
            </div>
        </div>

        <section class="welcome-card">
            <div class="welcome-text">
                <h2>Hello Atiya!</h2>
                <p>Are you experiencing any particular pain today?</p>
            </div>
            <div class="profile-container">
                <button class="notif-btn">
                    <i class="fa-solid fa-bell"></i>
                </button>
                <div class="avatar-wrap">
                    <img src="images/avatar.png" alt="Avatar" class="avatar">
                    <span class="uid">UID00001</span>
                </div>
            </div>
        </section>

        <section class="body-section">
            <img src="images/front.png" alt="Body Map" class="body-image">
        </section>

        <button class="start-button" id="startBtn">
            Start!
        </button>

        <nav class="bottom-nav">
            <button class="nav-item active">
                <i class="fa-solid fa-house"></i>
            </button>
            <button class="nav-item">
                <i class="fa-regular fa-bell"></i>
            </button>
            <button class="nav-item">
                <i class="fa-solid fa-store"></i>
            </button>
            <button class="nav-item">
                <i class="fa-solid fa-gear"></i>
            </button>
        </nav>

    </main>

    <script src="js/home.js"></script>

</body>

</html>
