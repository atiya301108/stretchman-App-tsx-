<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stretchman - Leaderboard</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/leaderboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<main class="leaderboard-page">

    <!-- HEADER -->
    <header class="leaderboard-header">
        <button class="back-button" id="backBtn">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div>
            <h1>Leaderboard</h1>
            <p>แข่งขันกับเพื่อนของคุณ</p>
        </div>
        <button class="history-button" id="historyBtn">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </button>
    </header>

    <!-- STREAK -->
    <section class="streak-card">
        <div class="streak-top">
            <div class="streak-icon">🔥</div>
            <div>
                <span>Current Streak</span>
                <strong>
                    <span data-streak>0</span> วัน
                </strong>
            </div>
            <div class="streak-best">
                <small>Best</small>
                <b id="bestStreak">0</b>
            </div>
        </div>
        <div class="streak-days">
            <div class="day"><span>จ.</span><i></i></div>
            <div class="day"><span>อ.</span><i></i></div>
            <div class="day"><span>พ.</span><i></i></div>
            <div class="day"><span>พฤ.</span><i></i></div>
            <div class="day"><span>ศ.</span><i></i></div>
            <div class="day"><span>ส.</span><i></i></div>
            <div class="day"><span>อา.</span><i></i></div>
        </div>
    </section>

    <!-- PLAYER STATUS -->
    <section class="player-card">
        <div class="player-avatar">👤</div>
        <div class="player-info">
            <strong>Atiya</strong>
            <span>Level <b data-level>1</b></span>
        </div>
        <!-- เพิ่มส่วนแสดงเหรียญ (Coins) -->
        <div class="player-coins" style="margin-right: 12px; text-align: right;">
            <strong data-coins style="font-size: 16px; color: #f59e0b;">0</strong>
            <span style="display: block; font-size: 7px; color: #777;">Coins</span>
        </div>
        <div class="player-xp">
            <strong data-xp style="color: #2563eb;">0</strong>
            <span>XP</span>
        </div>
    </section>

    <!-- LEADERBOARD -->
    <section class="leaderboard-section">
        <div class="section-title">
            <div>
                <h2>Weekly Leaderboard</h2>
                <p>อันดับประจำสัปดาห์</p>
            </div>
            <span class="trophy">🏆</span>
        </div>

        <!-- TOP 3 -->
        <div class="podium" id="podium">
            <!-- จะถูกเรนเดอร์ด้วย JavaScript -->
        </div>

        <!-- OTHER PLAYERS -->
        <div class="ranking-list" id="rankingList">
            <!-- จะถูกเรนเดอร์ด้วย JavaScript -->
        </div>

        <!-- CURRENT USER POSITION (ถ้ามีใช้งาน) -->
        <div id="myRanking"></div>
    </section>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="quest.html" class="nav-item">
            <i class="fa-solid fa-book-open"></i>
            <span>Quest</span>
        </a>
        <a href="alarm.html" class="nav-item">
            <i class="fa-solid fa-bell"></i>
            <span>Alarm</span>
        </a>
        <a href="shop.html" class="nav-item">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Shop</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </a>
    </nav>

</main>

<script src="js/app.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
