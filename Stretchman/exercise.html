<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Stretchman - ท่ายืดที่แนะนำ</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/exercise.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>

<main class="exercise-page">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="exercise-header">

        <button
            class="back-button"
            id="backBtn">

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <div class="header-title">

            <h1>
                ท่ายืดที่แนะนำ
            </h1>

            <p>
                Stretchman แนะนำให้คุณ
            </p>

        </div>


        <div class="header-icon">

            <i class="fa-solid fa-person-running"></i>

        </div>

    </header>



    <!-- =========================
         SELECTED INFO
    ========================== -->

    <section class="selected-info">

        <div class="info-item">

            <span>
                จุดที่ปวด
            </span>

            <strong id="painArea">
                -
            </strong>

        </div>


        <div class="info-item">

            <span>
                ระดับความปวด
            </span>

            <strong id="painLevel">
                -
            </strong>

        </div>


        <div class="info-item">

            <span>
                อาการ
            </span>

            <strong id="painType">
                -
            </strong>

        </div>

    </section>



    <!-- =========================
         TITLE
    ========================== -->

    <section class="recommend-title">

        <h2>
            ท่าที่เหมาะกับคุณ
        </h2>

        <p>
            ลองเลือกท่าที่คุณต้องการทำ
        </p>

    </section>



    <!-- =========================
         EXERCISE LIST
    ========================== -->

    <section
        class="exercise-list"
        id="exerciseList">


        <!-- JavaScript จะสร้างการ์ดตรงนี้ -->


    </section>



    <!-- =========================
         START BUTTON
    ========================== -->

    <button
        class="start-button"
        id="startBtn">

        <span>
            เริ่มยืดกล้ามเนื้อ
        </span>

        <i class="fa-solid fa-arrow-right"></i>

    </button>



    <!-- =========================
         BOTTOM NAV
    ========================== -->

    <nav class="bottom-nav">

    <a href="home.html"
       class="nav-item">

        <i class="fa-solid fa-house"></i>

        <span>Home</span>

    </a>


    <a href="quest.html"
       class="nav-item">

        <i class="fa-solid fa-book-open"></i>

        <span>Quest</span>

    </a>


    <a href="alarm.html"
       class="nav-item">

        <i class="fa-solid fa-bell"></i>

        <span>Alarm</span>

    </a>


    <a href="shop.html"
       class="nav-item">

        <i class="fa-solid fa-cart-shopping"></i>

        <span>Shop</span>

    </a>


    <a href="settings.html"
       class="nav-item">

        <i class="fa-solid fa-gear"></i>

        <span>Settings</span>

    </a>

</nav>


</main>

<script src="js/reward.js"></script>
<script src="js/exercise.js"></script>
<script src="js/theme.js"></script>
</body>

</html>
